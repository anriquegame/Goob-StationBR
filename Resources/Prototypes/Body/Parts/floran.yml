- type: entity
  id: PartFloran
  parent: [BaseItem, BasePart]
  name: "floran body part"
  abstract: true
  components:
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#cd7314"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Sprite
    sprite: Mobs/Species/Floran/parts.rsi
  - type: Icon # Shitmed Change
    sprite: Mobs/Species/Floran/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Floran
  - type: Damageable # Shitmed
    damageModifierSet: Floran

- type: entity
  id: ChestFloran
  name: "floran chest"
  parent: [PartFloran, BaseChest]
  components:
  - type: Sprite
    state: "chest_m"

