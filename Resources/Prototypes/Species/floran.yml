- type: species
  id: Floran
  name: Floran
  roundStart: true
  prototype: MobFloran
  sprites: MobFloranSprites
  defaultSkinTone: "#cdb369"
  markingLimits: MobFloranMarkingLimits
  dollPrototype: MobFloranDummy
  skinColoration: Hues
  maleFirstNames: NamesDionaFirst #checar
  femaleFirstNames: NamesDionaFirst #checar
  lastNames: NamesDionaLast #checar
  naming: TheFirstofLast #checar

- type: speciesBaseSprites
  id: MobFloranSprites
  sprites:
    Head: MobFloranHead
    Hair: MobHumanoidAnyMarking
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Underwear: MobHumanoidAnyMarking
    Undershirt: MobHumanoidAnyMarking
    Chest: MobFloranChest
    Groin: MobFloranGroin
    Eyes: MobHumanoidEyes
    LArm: MobFloranLArm
