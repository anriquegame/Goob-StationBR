    RHand: MobFloranRHand
    LLeg: MobFloranLLeg
    RLeg: MobFloranRLeg
    LFoot: MobFloranLFoot
    RFoot: MobFloranRFoot

- type: markingPoints
  id: MobFloranMarkingLimits
  onlyWhitelisted: false
  points:
    Hair:
      points: 1
      required: false
    Overlay:
      points: 1
      required: true
      defaultMarkings: [ FloranLeavesOverlay1 ]

